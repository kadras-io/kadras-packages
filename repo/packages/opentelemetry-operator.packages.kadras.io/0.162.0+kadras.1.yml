apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: opentelemetry-operator.packages.kadras.io.0.162.0+kadras.1
spec:
  licenses:
  - Apache 2.0
  refName: opentelemetry-operator.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/package-for-opentelemetry-operator/releases
  releasedAt: "2026-11-11T23:11:01Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/package-for-opentelemetry-operator@sha256:afd76ce079cc513530ab629a2a54fc736324bc96f301562f2b3ed13b1b9e0da7
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        args:
          default: {}
          description: Container flags, merged on top of the ones computed by the
            package. Set a flag to null to remove it. See https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/reference/configuration.md.
          example:
            watch-namespace: observability,apps
          nullable: true
          x-example-description: Watched namespaces
        auto_instrumentation:
          additionalProperties: false
          description: The languages that the Instrumentation resources can instrument,
            by injecting the OpenTelemetry instrumentation libraries in the Pods.
          properties:
            apache_httpd:
              default: true
              description: Whether to support Apache HTTPD auto-instrumentation.
              type: boolean
            dotnet:
              default: true
              description: Whether to support .NET auto-instrumentation.
              type: boolean
            go:
              default: false
              description: Whether to support Go auto-instrumentation. It injects
                a privileged sidecar container, which the `baseline` and `restricted`
                Pod Security Standards reject.
              type: boolean
            java:
              default: true
              description: Whether to support Java auto-instrumentation.
              type: boolean
            multi_instrumentation:
              default: true
              description: Whether to support instrumenting the containers of the
                same Pod with different languages.
              type: boolean
            nginx:
              default: true
              description: Whether to support Nginx auto-instrumentation.
              type: boolean
            nodejs:
              default: true
              description: Whether to support Node.js auto-instrumentation.
              type: boolean
            php:
              default: false
              description: Whether to support PHP auto-instrumentation.
              type: boolean
            python:
              default: true
              description: Whether to support Python auto-instrumentation.
              type: boolean
            ruby:
              default: false
              description: Whether to support Ruby auto-instrumentation.
              type: boolean
          type: object
        config:
          default: {}
          description: Operator configuration file, merged on top of the one computed
            by the package. Set an option to null to remove it. See https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/reference/configuration.md.
          example:
            collector-image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
          nullable: true
          x-example-description: Default collector image
        namespace:
          default: opentelemetry-operator-system
          description: The namespace in which to deploy the OpenTelemetry Operator.
          maxLength: 63
          minLength: 1
          type: string
        observability:
          additionalProperties: false
          description: Settings for logs and metrics.
          properties:
            logging:
              additionalProperties: false
              properties:
                level:
                  default: info
                  description: The log level of the operator. The logs are always
                    in JSON format.
                  enum:
                  - debug
                  - info
                  - error
                  type: string
              type: object
            metrics:
              additionalProperties: false
              properties:
                enabled:
                  default: true
                  description: Whether to annotate the operator Pods for Prometheus
                    scraping. The operator exposes metrics on port 8443 (`/metrics`),
                    over HTTPS and with authentication, unless configured otherwise
                    via `config`.
                  type: boolean
              type: object
          type: object
        replicas:
          default: 1
          description: The number of operator replicas. Additional replicas are standby
            via leader election, and all of them serve the admission webhooks. With
            more than 1 replica, a PodDisruptionBudget is created.
          minimum: 1
          type: integer
      type: object
  version: 0.162.0+kadras.1
