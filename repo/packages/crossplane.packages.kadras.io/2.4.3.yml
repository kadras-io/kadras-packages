apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: crossplane.packages.kadras.io.2.4.3
spec:
  licenses:
  - Apache 2.0
  refName: crossplane.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/package-for-crossplane/releases
  releasedAt: "2026-11-10T19:40:35Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/package-for-crossplane@sha256:5ce3162de8ba610e313bb406db6a1eaf73b9b4ff339303469963d74ca6607ceb
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        ca_cert_data:
          default: ""
          description: PEM-encoded certificates of additional certificate authorities
            to trust when pulling packages, for example from a private OCI registry.
            The system ones are still trusted.
          type: string
        crossplane:
          additionalProperties: false
          description: Settings for the Crossplane core, which runs the package manager,
            the composition engine, and the webhooks.
          properties:
            args:
              default: {}
              description: Container flags, merged on top of the ones computed by
                the package, which enable all the alpha features. Set a flag to null
                to remove it. See https://docs.crossplane.io/latest/get-started/install/#feature-flags.
              example:
                max-concurrent-reconciles: 200
                poll-interval: 5m
              nullable: true
              x-example-description: Vertical scaling
          type: object
        functions:
          additionalProperties: false
          description: The composition functions installed with the package. See docs/packages.md.
          properties:
            auto_ready:
              additionalProperties: false
              description: Settings for function-auto-ready, which detects the composed
                resources that are ready, so that the composite resource becomes ready
                when all of them are.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
            cel_filter:
              additionalProperties: false
              description: Settings for function-cel-filter, which filters the composed
                resources with CEL expressions.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
            extra_resources:
              additionalProperties: false
              description: Settings for function-extra-resources, which selects existing
                resources from the cluster for the next functions of the pipeline.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
            kcl:
              additionalProperties: false
              description: Settings for function-kcl, which composes resources with
                KCL.
              properties:
                enabled:
                  default: true
                  description: Whether to install the function.
                  type: boolean
              type: object
            kro:
              additionalProperties: false
              description: Settings for function-kro, which composes resources with
                kro ResourceGraphDefinitions.
              properties:
                enabled:
                  default: true
                  description: Whether to install the function.
                  type: boolean
              type: object
            patch_and_transform:
              additionalProperties: false
              description: Settings for function-patch-and-transform, which composes
                resources with patches and transforms.
              properties:
                enabled:
                  default: true
                  description: Whether to install the function.
                  type: boolean
              type: object
            pythonic:
              additionalProperties: false
              description: Settings for function-pythonic, which composes resources
                with Python.
              properties:
                enabled:
                  default: true
                  description: Whether to install the function.
                  type: boolean
              type: object
            sequencer:
              additionalProperties: false
              description: Settings for function-sequencer, which delays the creation
                of composed resources until other ones are ready.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
            shell:
              additionalProperties: false
              description: Settings for function-shell, which runs shell commands
                and writes their output to fields of the composite resource.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
            status_transformer:
              additionalProperties: false
              description: Settings for function-status-transformer, which sets status
                conditions on the composite resource by matching the ones of the composed
                resources.
              properties:
                enabled:
                  default: false
                  description: Whether to install the function.
                  type: boolean
              type: object
          type: object
        namespace:
          default: crossplane-system
          description: The namespace in which to deploy Crossplane. Crossplane also
            deploys the providers and functions there.
          type: string
        observability:
          additionalProperties: false
          description: Settings for logs and metrics.
          properties:
            logging:
              additionalProperties: false
              properties:
                level:
                  default: info
                  description: The log level of the controllers.
                  enum:
                  - info
                  - debug
                  type: string
              type: object
            metrics:
              additionalProperties: false
              properties:
                enabled:
                  default: true
                  description: Whether to annotate the Pods for Prometheus scraping.
                    The controllers always expose metrics on port 8080 (`/metrics`).
                  type: boolean
              type: object
          type: object
        providers:
          additionalProperties: false
          description: Settings for the Crossplane providers.
          properties:
            default_activations:
              default:
              - '*'
              description: 'The activations of the default ManagedResourceActivationPolicy,
                created at startup: the managed resource kinds of the providers to
                activate, as patterns like `*.aws.m.upbound.io`. Activate only the
                ones you use to reduce the CustomResourceDefinitions in the cluster,
                or set no activation to manage the policies yourself.'
              items:
                default: ""
                type: string
              type: array
          type: object
        proxy:
          additionalProperties: false
          description: Settings for the corporate proxy, used to pull packages from
            OCI registries.
          properties:
            http_proxy:
              default: ""
              description: The HTTP proxy to use for network traffic.
              type: string
            https_proxy:
              default: ""
              description: The HTTPS proxy to use for network traffic.
              type: string
            no_proxy:
              default: ""
              description: A comma-separated list of hostnames, IP addresses, or IP
                ranges in CIDR format that should not use the proxy. Include the in-cluster
                domains, since Crossplane calls the functions over the cluster network.
              example: .cluster.local.,.cluster.local,.svc,10.0.0.0/8
              type: string
              x-example-description: Bypass the proxy for in-cluster traffic
          type: object
        rbac_manager:
          additionalProperties: false
          description: Settings for the RBAC manager, which grants Crossplane and
            the providers the permissions on the resources they reconcile.
          properties:
            args:
              default: {}
              description: Container flags, merged on top of the ones computed by
                the package. Set a flag to null to remove it.
              example:
                max-concurrent-reconciles: 20
              nullable: true
              x-example-description: Vertical scaling
          type: object
      type: object
  version: 2.4.3
