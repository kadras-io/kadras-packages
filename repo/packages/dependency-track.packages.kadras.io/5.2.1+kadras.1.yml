apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: dependency-track.packages.kadras.io.5.2.1+kadras.1
spec:
  licenses:
  - Apache 2.0
  refName: dependency-track.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/package-for-dependency-track/releases
  releasedAt: "2026-11-10T23:47:46Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/package-for-dependency-track@sha256:6519e52fa094ff7f4d196bced027f255c75c0423627af592192226171c667ae1
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        api_server:
          additionalProperties: false
          description: Settings for the API Server component.
          properties:
            config:
              default: {}
              description: Additional configuration properties for the API Server,
                appended to the `application.properties` file and taking precedence
                over the ones managed by this package. See https://dependencytrack.github.io/docs/next/reference/configuration/properties
                for the full list.
              example:
                dt.dex-engine.activity-worker.vuln-analysis.max-concurrency: 20
              nullable: true
              x-example-description: Tune the durable execution engine
            replicas:
              default: 1
              description: The number of API Server replicas. Values greater than
                1 require the `ReadWriteMany` access mode for the storage.
              minimum: 1
              type: integer
            resources:
              additionalProperties: false
              description: Compute resources for the API Server.
              properties:
                limits:
                  additionalProperties: false
                  description: The maximum resources the API Server can use.
                  properties:
                    cpu:
                      default: "4"
                      description: The CPU limit for the API Server.
                      type: string
                    memory:
                      default: 5Gi
                      description: The memory limit for the API Server.
                      type: string
                  type: object
                requests:
                  additionalProperties: false
                  description: The minimum resources reserved for the API Server.
                  properties:
                    cpu:
                      default: "0.5"
                      description: The CPU requested by the API Server.
                      type: string
                    memory:
                      default: 5Gi
                      description: The memory requested by the API Server.
                      type: string
                  type: object
              type: object
            storage:
              additionalProperties: false
              description: Settings for the PersistentVolume holding the API Server
                file storage, where uploaded BOMs and other artifacts are stored.
              properties:
                access_modes:
                  default:
                  - ReadWriteOnce
                  description: The access modes for the PersistentVolume. `ReadWriteMany`
                    is required when running more than one API Server replica.
                  items:
                    default: ReadWriteOnce
                    type: string
                  minItems: 1
                  type: array
                class_name:
                  default: ""
                  description: The StorageClass for the PersistentVolume. When empty,
                    the default StorageClass is used.
                  type: string
                size:
                  default: 1Gi
                  description: The size of the PersistentVolume.
                  minLength: 1
                  type: string
              type: object
          type: object
        ca_cert_data:
          default: ""
          description: PEM-encoded certificates of the CAs to trust in TLS connections,
            in addition to the public ones. They're imported into the Java truststore
            used by the API Server.
          type: string
        frontend:
          additionalProperties: false
          description: Settings for the Frontend component.
          properties:
            config:
              default: {}
              description: Configuration for the Frontend, provided as environment
                variables. Use it to enable OpenID Connect, or to point the Frontend
                at an API Server served from a different host via `API_BASE_URL`.
                See https://dependencytrack.github.io/docs/next/guides/administration/configuring-oidc
                for the OpenID Connect settings.
              example:
                OIDC_CLIENT_ID: dependency-track
                OIDC_ISSUER: https://idp.kadras.io
                OIDC_SCOPE: openid profile email
              nullable: true
              x-example-description: Enable OpenID Connect
            replicas:
              default: 1
              description: The number of Frontend replicas. Set it greater than 1
                for high availability.
              minimum: 1
              type: integer
            resources:
              additionalProperties: false
              description: Compute resources for the Frontend.
              properties:
                limits:
                  additionalProperties: false
                  description: The maximum resources the Frontend can use.
                  properties:
                    cpu:
                      default: 500m
                      description: The CPU limit for the Frontend.
                      type: string
                    memory:
                      default: 128Mi
                      description: The memory limit for the Frontend.
                      type: string
                  type: object
                requests:
                  additionalProperties: false
                  description: The minimum resources reserved for the Frontend.
                  properties:
                    cpu:
                      default: 150m
                      description: The CPU requested by the Frontend.
                      type: string
                    memory:
                      default: 64Mi
                      description: The memory requested by the Frontend.
                      type: string
                  type: object
              type: object
          type: object
        image:
          additionalProperties: false
          description: Settings for the Dependency Track container images.
          properties:
            tag:
              default: ""
              description: The tag to use for the API Server and Frontend container
                images, overriding the Dependency Track version bundled with this
                package. The images must be available in a container registry reachable
                from the cluster, since they are not part of the package bundle.
              example: 5.2.2
              type: string
              x-example-description: Deploy a newer patch release
          type: object
        ingress:
          additionalProperties: false
          description: Settings for the HTTPRoute exposing Dependency Track through
            a Gateway API Gateway, like the external Gateway of the Envoy Gateway
            package. TLS is terminated on the Gateway, which needs an HTTPS listener
            whose hostname matches `ingress.hostname`, like the `*.<domain>` one of
            the Envoy Gateway package.
          properties:
            enabled:
              default: true
              description: Whether to expose Dependency Track via an HTTPRoute. When
                disabled, expose the `dependency-track-frontend` and `dependency-track-api-server`
                Services yourself.
              type: boolean
            gateway:
              additionalProperties: false
              description: The Gateway the HTTPRoute attaches to. It must allow routes
                from the package namespace.
              properties:
                name:
                  default: external
                  description: The name of the Gateway.
                  type: string
                namespace:
                  default: envoy-gateway-system
                  description: The namespace of the Gateway.
                  type: string
              type: object
            hostname:
              default: ""
              description: The hostname where Dependency Track is served. Both the
                Frontend and the API Server (under `/api`) are served from it. Required
                when `enabled` is true.
              example: dependency-track.kadras.io
              type: string
              x-example-description: Kadras domain
          type: object
        namespace:
          default: dependency-track
          description: The namespace where to install Dependency Track.
          type: string
        observability:
          additionalProperties: false
          description: Settings for logs and metrics.
          properties:
            logging:
              additionalProperties: false
              description: Settings for the API Server logs.
              properties:
                format:
                  default: json
                  description: 'The log format: `text`, or `json` for structured logs.'
                  enum:
                  - text
                  - json
                  type: string
                level:
                  default: info
                  description: 'The log verbosity level: `trace`, `debug`, `info`,
                    `warn`, or `error`.'
                  enum:
                  - trace
                  - debug
                  - info
                  - warn
                  - error
                  type: string
              type: object
            metrics:
              additionalProperties: false
              description: Settings for the Prometheus metrics.
              properties:
                enabled:
                  default: true
                  description: Whether the API Server and PostgreSQL expose Prometheus
                    metrics, and their Pods are annotated for scraping.
                  type: boolean
              type: object
          type: object
        postgresql:
          additionalProperties: false
          description: Settings for the PostgreSQL database, run by the CloudNativePG
            operator.
          properties:
            instances:
              default: 1
              description: 'The number of PostgreSQL instances: one primary and its
                replicas. Use at least 3 in production.'
              minimum: 1
              type: integer
            parameters:
              default: {}
              description: Configuration parameters for the PostgreSQL server, merged
                on top of the ones recommended by Dependency Track (`jit=off` and
                `wal_compression=zstd`). Remember that `max_connections` must cover
                the sum of the connection pools of all the API Server replicas, plus
                headroom for migrations, backups, and administrator sessions.
              example:
                effective_cache_size: 6GB
                max_connections: 200
                shared_buffers: 2GB
              nullable: true
              x-example-description: Tune a production database
            resources:
              additionalProperties: false
              description: Compute resources for each PostgreSQL instance. The empty
                ones are not set.
              properties:
                limits:
                  additionalProperties: false
                  description: The maximum resources each PostgreSQL instance can
                    use.
                  properties:
                    cpu:
                      default: ""
                      description: The CPU limit for each PostgreSQL instance.
                      type: string
                    memory:
                      default: ""
                      description: The memory limit for each PostgreSQL instance.
                      type: string
                  type: object
                requests:
                  additionalProperties: false
                  description: The minimum resources reserved for each PostgreSQL
                    instance.
                  properties:
                    cpu:
                      default: ""
                      description: The CPU requested by each PostgreSQL instance.
                      example: "2"
                      type: string
                      x-example-description: Two cores
                    memory:
                      default: ""
                      description: The memory requested by each PostgreSQL instance.
                      example: 8Gi
                      type: string
                      x-example-description: Eight gibibytes
                  type: object
              type: object
            storage:
              additionalProperties: false
              description: Settings for the PersistentVolume of each PostgreSQL instance.
              properties:
                class_name:
                  default: ""
                  description: The StorageClass for the PersistentVolumes. When empty,
                    the default StorageClass is used.
                  type: string
                size:
                  default: 1Gi
                  description: The size of the PersistentVolume of each PostgreSQL
                    instance.
                  minLength: 1
                  type: string
              type: object
          type: object
        proxy:
          additionalProperties: false
          description: Settings for the corporate proxy used by the API Server when
            calling external services.
          properties:
            http_proxy:
              default: ""
              description: The proxy for the network traffic, in the form `http://[user[:password]@]host[:port]`.
                Used only when `https_proxy` is not set.
              type: string
            https_proxy:
              default: ""
              description: The proxy for the network traffic, in the form `http://[user[:password]@]host[:port]`.
              type: string
            no_proxy:
              default: ""
              description: A comma-separated list of hostnames or IP addresses, optionally
                with a port, that should not use the proxy. An entry matches the host
                exactly or any of its subdomains. CIDR ranges and leading-dot notation
                are not supported.
              example: localhost,kadras.io
              type: string
              x-example-description: Skip the proxy for internal services
          type: object
      type: object
  version: 5.2.1+kadras.1
