apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: flagger.packages.kadras.io.1.45.0
spec:
  licenses:
  - Apache 2.0
  refName: flagger.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/package-for-flagger/releases
  releasedAt: "2026-11-10T20:54:51Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/package-for-flagger@sha256:e5a8e5499dfa8f5b038621618c52fdc80237989bbd84771e83a0468590096f53
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        args:
          default: {}
          description: Container flags, merged on top of the ones computed by the
            package. Set a flag to null to remove it. See https://github.com/fluxcd/flagger/blob/main/cmd/flagger/main.go.
          example:
            cluster-name: production
            slack-channel: deployments
            slack-url: https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
          nullable: true
          x-example-description: Alerting
        ca_cert_data:
          default: ""
          description: PEM-encoded certificates of additional certificate authorities
            to trust, for example to reach a metrics provider, a webhook, or an alert
            provider. The system ones are still trusted.
          type: string
        mesh_provider:
          default: gatewayapi:v1
          description: The default provider managing the traffic of the Canaries,
            used when a Canary doesn't set `spec.provider`. With `gatewayapi:v1`,
            Flagger shifts the traffic via HTTPRoutes, like the ones attached to the
            Gateways of the Kadras Envoy Gateway package. With `knative`, it shifts
            the traffic between the revisions of Knative Services. With `kubernetes`,
            it runs blue/green deployments without shifting traffic. See https://docs.flagger.app/main/usage/deployment-strategies.
          type: string
        metrics_server:
          default: http://prometheus-prometheus.observability:9090
          description: The URL of the Prometheus server queried by the built-in metrics
            of the canary analysis (`request-success-rate` and `request-duration`).
            MetricTemplates set their own address.
          minLength: 1
          type: string
        namespace:
          default: flagger-system
          description: The namespace in which to deploy Flagger.
          maxLength: 63
          minLength: 1
          type: string
        observability:
          additionalProperties: false
          description: Settings for logs and metrics.
          properties:
            logging:
              additionalProperties: false
              properties:
                format:
                  default: json
                  description: The format of the logs.
                  enum:
                  - text
                  - json
                  type: string
                level:
                  default: info
                  description: The log level of Flagger.
                  enum:
                  - debug
                  - info
                  - warn
                  - error
                  type: string
              type: object
            metrics:
              additionalProperties: false
              properties:
                enabled:
                  default: true
                  description: Whether to annotate the Pods for Prometheus scraping.
                    Flagger always exposes metrics on port 8080 (`/metrics`).
                  type: boolean
              type: object
          type: object
        policies:
          additionalProperties: false
          description: Settings for the Kyverno policies.
          properties:
            enabled:
              default: false
              description: Whether to include the Kyverno policies that validate and
                secure the package installation. They require Kyverno 1.19 or later.
              type: boolean
          type: object
        proxy:
          additionalProperties: false
          description: Settings for the corporate proxy, used to reach metrics providers,
            webhooks, and alert providers.
          properties:
            http_proxy:
              default: ""
              description: The HTTP proxy to use for network traffic.
              type: string
            https_proxy:
              default: ""
              description: The HTTPS proxy to use for network traffic.
              type: string
            no_proxy:
              default: ""
              description: A comma-separated list of hostnames, IP addresses, or IP
                ranges in CIDR format that should not use the proxy. Include the in-cluster
                domains, since Flagger reaches Prometheus and the webhooks, like the
                load tester, within the cluster.
              example: .cluster.local.,.cluster.local,.svc,10.0.0.0/8
              type: string
              x-example-description: Bypass the proxy for in-cluster traffic
          type: object
        replicas:
          default: 1
          description: The number of replicas. Additional replicas are standby via
            leader election. With more than 1 replica, a PodDisruptionBudget is created.
          minimum: 1
          type: integer
      type: object
  version: 1.45.0
