apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: gitops-configurer.packages.kadras.io.0.3.0
spec:
  licenses:
  - Apache 2.0
  refName: gitops-configurer.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/gitops-configurer/releases
  releasedAt: "2026-10-26T06:57:08Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/gitops-configurer@sha256:cba3651ba2bbd62f41a5c331ebf38ec49189bb3eb2cacd76d4a1914c2a4e8435
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        controller:
          default: flux
          description: 'The controller reconciling the manifests with the cluster:
            `carvel` creates a kapp-controller App, `flux` a Flux source and Kustomization.'
          enum:
          - carvel
          - flux
          type: string
        flux:
          additionalProperties: false
          description: Settings for the `flux` controller.
          properties:
            prune:
              default: true
              description: Whether to delete the resources removed from the source.
                It also deletes all the resources applied by the Kustomization when
                it's deleted, including when uninstalling the package.
              type: boolean
            timeout:
              default: 1m0s
              description: The timeout for applying the manifests and, with `flux.wait`,
                for the resources to become ready, as a Go duration.
              type: string
            wait:
              default: true
              description: Whether to wait for the applied resources to become ready
                before marking the Kustomization as ready.
              type: boolean
          type: object
        git:
          additionalProperties: false
          description: Settings for the `git` source.
          properties:
            branch:
              default: main
              description: The Git branch to check out.
              minLength: 1
              type: string
            path:
              default: ""
              description: The path within the Git repository containing the manifests.
                The root of the repository when empty.
              type: string
            secret_name:
              default: ""
              description: The name of the Secret in the same namespace holding the
                credentials to access the Git repository. See docs/sources.md for
                the format expected by each controller.
              type: string
            url:
              default: ""
              description: The URL of the Git repository. Required with the `git`
                source.
              example: https://github.com/kadras-io/my-gitops-repo
              type: string
              x-example-description: HTTPS
          type: object
        interval:
          default: 1m0s
          description: The interval at which the source is fetched and the manifests
            reconciled with the cluster, as a Go duration.
          type: string
        name:
          default: gitops-configurer
          description: The name of the GitOps resources.
          maxLength: 253
          minLength: 1
          type: string
        namespace:
          default: kadras-system
          description: The namespace in which to create the GitOps resources. It must
            exist.
          maxLength: 63
          minLength: 1
          type: string
        oci:
          additionalProperties: false
          description: Settings for the `oci` source.
          properties:
            digest:
              default: ""
              description: The digest of the OCI artifact, like `sha256:5f2f...`.
                It takes precedence over `oci.tag`.
              type: string
            path:
              default: ""
              description: The path within the OCI artifact containing the manifests.
                The root of the artifact when empty.
              type: string
            provider:
              default: generic
              description: 'The provider used to authenticate with the OCI registry:
                `generic` for the credentials in `oci.secret_name`, or a cloud provider
                for workload identity. Cloud providers require the `flux` controller.'
              enum:
              - generic
              - aws
              - azure
              - gcp
              type: string
            secret_name:
              default: ""
              description: The name of the Secret in the same namespace holding the
                credentials to access the OCI registry. See docs/sources.md for the
                format expected by each controller.
              type: string
            semver:
              default: ""
              description: The semver range selecting the tag of the OCI artifact,
                like `1.x` or `>=1.0.0`. The highest matching tag is used.
              type: string
            service_account:
              default: ""
              description: 'The ServiceAccount in the same namespace used to authenticate
                with the OCI registry: its image pull secrets with the `generic` provider,
                its workload identity with a cloud provider. It requires the `flux`
                controller.'
              type: string
            tag:
              default: latest
              description: The tag of the OCI artifact. Ignored when `oci.semver`
                or `oci.digest` is set.
              minLength: 1
              type: string
            url:
              default: ""
              description: The URL of the OCI artifact, with the `oci://` scheme.
                Required with the `oci` source.
              example: oci://ghcr.io/stefanprodan/manifests/podinfo
              type: string
              x-example-description: Flux artifact
          type: object
        service_account:
          default: ""
          description: The ServiceAccount in the same namespace whose permissions
            are used to deploy the manifests. Required with the `carvel` controller.
            With the `flux` controller, the kustomize controller uses its own permissions
            when empty.
          type: string
        source:
          default: git
          description: 'Where the manifests are fetched from: `git` for a Git repository,
            `oci` for an OCI artifact (a Flux artifact with the `flux` controller,
            an imgpkg bundle with the `carvel` controller).'
          enum:
          - git
          - oci
          type: string
        target_namespace:
          default: ""
          description: The namespace in which to deploy the manifests, overriding
            the namespace they set, if any. When empty, the `carvel` controller deploys
            the manifests without a namespace in the package namespace, while the
            `flux` controller requires all of them to set one.
          type: string
      type: object
  version: 0.3.0
