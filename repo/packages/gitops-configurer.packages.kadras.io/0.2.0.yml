apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: gitops-configurer.packages.kadras.io.0.2.0
spec:
  licenses:
  - Apache 2.0
  refName: gitops-configurer.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/gitops-configurer/releases
  releasedAt: "2026-08-16T19:33:01Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/gitops-configurer@sha256:61a56d69011099a67d5f4bcfd427c7744b193c28d82a1d4d5e7798f19a57e4ee
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        git:
          additionalProperties: false
          description: Configuration for synchronizing changes from Git.
          properties:
            branch:
              default: main
              description: The Git branch to check out and synchronize.
              type: string
            path:
              default: ""
              description: The path within the Git repository containing the manifests
                to reconcile with the cluster.
              type: string
            secret_name:
              default: ""
              description: The name of the Secret in the same namespace holding the
                credentials to access the Git server. The credentials should provide
                read-only access to the Git server.
              type: string
            url:
              default: ""
              description: The URL of the Git repository to synchronize in the cluster.
              type: string
          type: object
        name:
          default: gitops-configurer
          description: The name of the GitOps resource.
          type: string
        namespace:
          default: kadras-system
          description: The namespace where the GitOps resource should be installed.
          type: string
        oci:
          additionalProperties: false
          description: Configuration for synchronizing changes from an OCI registry.
          properties:
            digest:
              default: ""
              description: 'The digest of the OCI artifact to pull and synchronize.
                Example: `sha256:5f2f...`. It takes precedence over `oci.tag` and
                `oci.semver`.'
              type: string
            path:
              default: ""
              description: The path within the OCI artifact containing the manifests
                to reconcile with the cluster.
              type: string
            provider:
              default: generic
              description: 'The provider used for authenticating with the OCI registry.
                Use `generic` for static credentials via `oci.secret_name`, or a cloud
                provider for workload identity. Options: `generic`, `aws`, `azure`,
                `gcp`.'
              enum:
              - generic
              - aws
              - azure
              - gcp
              type: string
            secret_name:
              default: ""
              description: The name of the Secret in the same namespace holding the
                credentials to access the OCI registry. The credentials should provide
                read-only access to the OCI registry.
              type: string
            semver:
              default: ""
              description: 'The semver range used to select which OCI artifact tag
                to pull and synchronize. Example: `1.x`. Ignored when `oci.digest`
                is configured.'
              type: string
            service_account:
              default: ""
              description: The name of the ServiceAccount in the same namespace used
                to authenticate with the OCI registry. With the `generic` provider,
                its image pull secrets are used. With a cloud provider, it is used
                for workload identity.
              type: string
            tag:
              default: latest
              description: The OCI artifact tag to pull and synchronize. Ignored when
                either `oci.semver` or `oci.digest` is configured.
              type: string
            url:
              default: ""
              description: 'The URL of the OCI artifact to synchronize in the cluster.
                It must use the `oci://` scheme. Example: `oci://ghcr.io/kadras-io/my-gitops-artifact`.'
              type: string
          type: object
        service_account:
          default: ""
          description: The `ServiceAccount` used by the GitOps controller to reconcile
            changes to the cluster.
          type: string
        sync_period:
          default: 1m0s
          description: 'The interval at which the GitOps controller should synchronize
            changes from Git. The format is a Go duration string. Example: `1m0s`.'
          type: string
        type:
          default: carvel-app
          description: 'The type of GitOps controller to use. Options: `carvel-app`,
            `flux-kustomization`, `flux-oci-kustomization`.'
          enum:
          - carvel-app
          - flux-kustomization
          - flux-oci-kustomization
          type: string
      type: object
  version: 0.2.0
