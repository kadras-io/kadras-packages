apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: engineering-platform.packages.kadras.io.0.33.2
spec:
  licenses:
  - Apache 2.0
  refName: engineering-platform.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/kadras-engineering-platform/releases
  releasedAt: "2026-11-12T06:57:17Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/kadras-engineering-platform@sha256:855ecd4b95ba733d3abb5ad06446eaf4244f202df9aa42ac0e121629dab2cb6b
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        ca_cert_data:
          default: ""
          description: PEM-encoded certificates of additional certificate authorities
            to trust, for example to reach a private OCI registry or Git server. Applied
            to all the packages supporting it.
          type: string
        cert_manager:
          default: {}
          description: Configuration for the cert-manager package. See https://github.com/kadras-io/package-for-cert-manager.
          nullable: true
        cert_manager_webhook_hetzner:
          default: {}
          description: Configuration for the cert-manager-webhook-hetzner package.
            See https://github.com/kadras-io/package-for-cert-manager-webhook-hetzner.
          nullable: true
        crossplane:
          default: {}
          description: Configuration for the Crossplane package. See https://github.com/kadras-io/package-for-crossplane.
          nullable: true
        dependency_track:
          default: {}
          description: Configuration for the Dependency Track package. See https://github.com/kadras-io/package-for-dependency-track.
          nullable: true
        developer_portal:
          default: {}
          description: Configuration for the Developer Portal package. See https://github.com/kadras-io/package-for-developer-portal.
          nullable: true
        envoy_gateway:
          default: {}
          description: Configuration for the Envoy Gateway package. See https://github.com/kadras-io/package-for-envoy-gateway.
          nullable: true
        flagger:
          default: {}
          description: Configuration for the Flagger package. See https://github.com/kadras-io/package-for-flagger.
          nullable: true
        flux:
          default: {}
          description: Configuration for the Flux package. See https://github.com/kadras-io/package-for-flux.
          nullable: true
        gitops_configurer:
          default: {}
          description: Configuration for the GitOps Configurer package. See https://github.com/kadras-io/gitops-configurer.
          nullable: true
        ingress:
          additionalProperties: false
          description: Settings for exposing the applications outside the cluster,
            via the external Gateway of Envoy Gateway.
          properties:
            domain:
              default: ""
              description: The base domain of the applications, served over HTTPS.
                Knative Services are served as `<name>.<workspace>.<domain>`. When
                empty, the `local` profile uses `127.0.0.1.sslip.io`, while the `run`
                profile serves no domain over HTTPS.
              example: example.com
              type: string
              x-example-description: Custom domain
            issuer:
              default: kadras-ca-issuer
              description: 'The cert-manager ClusterIssuer that issues the certificates
                for `*.<domain>` and `*.<workspace>.<domain>`. The default one uses
                the private CA of the cert-manager package. For Let''s Encrypt, wildcard
                certificates require a DNS-01 challenge: see docs/ingress.md.'
              example: letsencrypt-prod-issuer
              type: string
              x-example-description: Let's Encrypt
          type: object
        knative_serving:
          default: {}
          description: Configuration for the Knative Serving package. See https://github.com/kadras-io/package-for-knative-serving.
          nullable: true
        kyverno:
          default: {}
          description: Configuration for the Kyverno package. See https://github.com/kadras-io/package-for-kyverno.
          nullable: true
        metrics_server:
          default: {}
          description: Configuration for the Metrics Server package. See https://github.com/kadras-io/package-for-metrics-server.
          nullable: true
        namespace:
          default: kadras-system
          description: The namespace where the PackageInstalls of the platform packages
            are created. The packages deploy their workloads in their own namespaces.
          type: string
        observability:
          additionalProperties: false
          description: Settings for logs, metrics, and traces, applied to all the
            packages supporting them.
          properties:
            logging:
              additionalProperties: false
              properties:
                format:
                  default: json
                  description: The log format, for the packages where it's configurable.
                  enum:
                  - json
                  - text
                  type: string
                level:
                  default: info
                  description: The log level.
                  enum:
                  - info
                  - debug
                  type: string
              type: object
            metrics:
              additionalProperties: false
              properties:
                enabled:
                  default: true
                  description: Whether the components produce metrics.
                  type: boolean
                endpoint:
                  default: ""
                  description: The OTLP/gRPC endpoint of an in-cluster OpenTelemetry
                    collector, with the `otlp` exporter.
                  example: http://otel-collector.observability.svc:4317
                  type: string
                  x-example-description: OpenTelemetry collector
                exporter:
                  default: prometheus
                  description: How the metrics are exported. With `prometheus`, the
                    Pods are annotated for scraping. With `otlp`, Envoy Gateway, Knative
                    Serving, and Kyverno push them to `endpoint`, while the other
                    packages keep exposing them for scraping.
                  enum:
                  - prometheus
                  - otlp
                  type: string
              type: object
            tracing:
              additionalProperties: false
              properties:
                enabled:
                  default: false
                  description: Whether Envoy Gateway, Knative Serving, and Kyverno
                    export traces via OTLP/gRPC.
                  type: boolean
                endpoint:
                  default: ""
                  description: The OTLP/gRPC endpoint of an in-cluster OpenTelemetry
                    collector.
                  example: http://otel-collector.observability.svc:4317
                  type: string
                  x-example-description: OpenTelemetry collector
                sampling_rate:
                  default: 1
                  description: The fraction of requests to trace, from 0 (never) to
                    1 (always), for Envoy Gateway and Knative Serving.
                  format: float
                  maximum: 1
                  minimum: 0
                  type: number
              type: object
          type: object
        opentelemetry_operator:
          default: {}
          description: Configuration for the OpenTelemetry Operator package. See https://github.com/kadras-io/package-for-opentelemetry-operator.
          nullable: true
        packages:
          additionalProperties: false
          description: The packages to install, in addition to or instead of the default
            ones.
          properties:
            exclude:
              default: []
              description: The default packages not to install.
              items:
                default: ""
                type: string
              type: array
            include:
              default: []
              description: The optional packages to install.
              items:
                default: ""
                type: string
              type: array
          type: object
        policies:
          additionalProperties: false
          description: Settings for the Kyverno policies included in the packages,
            like the verification of their image signatures.
          properties:
            enabled:
              default: false
              description: Whether to include the Kyverno policies, in the packages
                supporting them. It requires the `kyverno` package.
              type: boolean
          type: object
        postgresql_operator:
          default: {}
          description: Configuration for the PostgreSQL Operator package. See https://github.com/kadras-io/package-for-postgresql-operator.
          nullable: true
        profile:
          default: run
          description: 'The installation profile. `run` for clusters exposing the
            applications via a load balancer. `local` for local clusters like kind
            and k3d: the default domain is `127.0.0.1.sslip.io`, the Gateway is exposed
            via the node ports 30080 (HTTP) and 30443 (HTTPS), and Metrics Server
            accepts the self-signed Kubelet certificates.'
          enum:
          - run
          - local
          type: string
        proxy:
          additionalProperties: false
          description: Settings for the corporate proxy, applied to all the packages
            supporting it.
          properties:
            http_proxy:
              default: ""
              description: The HTTP proxy to use for network traffic.
              type: string
            https_proxy:
              default: ""
              description: The HTTPS proxy to use for network traffic.
              type: string
            no_proxy:
              default: ""
              description: A comma-separated list of hostnames, IP addresses, or IP
                ranges in CIDR format that should not use the proxy. Include the in-cluster
                domains.
              example: .cluster.local.,.cluster.local,.svc,10.0.0.0/8
              type: string
              x-example-description: Bypass the proxy for in-cluster traffic
          type: object
        rabbitmq_operator:
          default: {}
          description: Configuration for the RabbitMQ Operator package. See https://github.com/kadras-io/package-for-rabbitmq-operator.
          nullable: true
        secretgen_controller:
          default: {}
          description: Configuration for the secretgen-controller package. See https://github.com/kadras-io/package-for-secretgen-controller.
          nullable: true
        security:
          additionalProperties: false
          description: Settings for the security of the platform workloads.
          properties:
            network_policies:
              default: false
              description: Whether to restrict the inbound traffic to the platform
                workloads via NetworkPolicies, in the packages supporting them.
              type: boolean
          type: object
        workspace_provisioner:
          default: {}
          description: Configuration for the Workspace Provisioner package. See https://github.com/kadras-io/workspace-provisioner.
          nullable: true
        workspaces:
          default: []
          description: The namespaces where the platform users deploy their workloads,
            provisioned by the Workspace Provisioner package. Each workspace gets
            its own HTTPS hostname on the external Gateway.
          items:
            additionalProperties: false
            properties:
              members:
                default: []
                description: The users and groups granted access to the workspace,
                  each with a `kind` (`User` or `Group`), a `name`, and a `role` (`admin`,
                  `edit`, or `view`).
                nullable: true
              name:
                default: ""
                description: The name of the namespace. It's created if it doesn't
                  exist.
                type: string
              pod_security:
                default: ""
                description: The Pod Security Standard enforced on the namespace.
                  When empty, `restricted`, unless configured otherwise in `workspace_provisioner.pod_security.level`.
                type: string
            type: object
          type: array
      type: object
  version: 0.33.2
