apiVersion: data.packaging.carvel.dev/v1alpha1
kind: Package
metadata:
  name: workspace-provisioner.packages.kadras.io.0.5.0
spec:
  licenses:
  - Apache 2.0
  refName: workspace-provisioner.packages.kadras.io
  releaseNotes: https://github.com/kadras-io/workspace-provisioner/releases
  releasedAt: "2026-11-10T20:58:43Z"
  template:
    spec:
      deploy:
      - kapp: {}
      fetch:
      - imgpkgBundle:
          image: ghcr.io/kadras-io/workspace-provisioner@sha256:755ee3d3acebdfd2aa5969c7d7771f155c8a85cee94151d12c9e9d4041b2a0be
      template:
      - ytt:
          paths:
          - config
      - kbld:
          paths:
          - '-'
          - .imgpkg/images.yml
  valuesSchema:
    openAPIv3:
      additionalProperties: false
      properties:
        cosign:
          additionalProperties: false
          description: Settings for Cosign, used to sign and verify OCI artifacts
            from the workspaces.
          properties:
            secret:
              additionalProperties: false
              description: The Secret holding the Cosign key pair, shared with the
                workspaces.
              properties:
                name:
                  default: ""
                  description: The name of the Secret holding the Cosign key pair.
                    See docs/credentials.md for the expected format.
                  type: string
                namespace:
                  default: ""
                  description: The namespace of the Secret holding the Cosign key
                    pair.
                  type: string
              type: object
          type: object
        git:
          additionalProperties: false
          description: Settings for accessing the Git repositories used in the GitOps
            workflows from the workspaces.
          properties:
            secret:
              additionalProperties: false
              description: The Secret holding the Git credentials, shared with the
                workspaces.
              properties:
                name:
                  default: ""
                  description: The name of the Secret holding the Git credentials.
                    See docs/credentials.md for the expected format.
                  type: string
                namespace:
                  default: ""
                  description: The namespace of the Secret holding the Git credentials.
                  type: string
              type: object
            server:
              default: https://github.com
              description: The Git server hosting the Git repositories used in the
                GitOps workflows.
              type: string
          type: object
        namespaces:
          default: []
          description: The namespaces to provision and configure as workspaces.
          items:
            additionalProperties: false
            description: A namespace to provision and configure as a workspace.
            properties:
              name:
                default: ""
                description: The name of the namespace. It's created if it doesn't
                  exist.
                maxLength: 63
                minLength: 1
                type: string
            type: object
          type: array
        oci:
          additionalProperties: false
          description: Settings for accessing the OCI registry from the workspaces.
          properties:
            pull_secret:
              additionalProperties: false
              description: The Secret holding the credentials to pull images from
                the OCI registry, shared with the workspaces.
              properties:
                name:
                  default: ""
                  description: The name of the Secret holding the credentials to pull
                    images from the OCI registry. See docs/credentials.md for the
                    expected format.
                  type: string
                namespace:
                  default: ""
                  description: The namespace of the Secret holding the credentials
                    to pull images from the OCI registry.
                  type: string
              type: object
          type: object
        service_account:
          default: supply-chain
          description: The ServiceAccount to configure with credentials and roles
            in each workspace.
          maxLength: 253
          minLength: 1
          type: string
      type: object
  version: 0.5.0
